name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: fastapi-production-template

jobs:
  ci:
    name: Lint, test, build, scan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app_test
          POSTGRES_USER: app_test
          POSTGRES_PASSWORD: app_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app_test -d app_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      APP_NAME: fastapi-production-template
      APP_VERSION: 0.1.0
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://app_test:app_test_password@localhost:5432/app_test
      REDIS_URL: redis://localhost:6379/1
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 2
      READINESS_TIMEOUT_SECONDS: 1
      DOCS_ENABLED: "true"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy app tests

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest

      - name: Docker build
        run: |
          docker build \
            --build-arg APP_VERSION="${APP_VERSION}" \
            --build-arg BUILD_SHA="${GITHUB_SHA}" \
            --build-arg IMAGE_SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${IMAGE_NAME}:ci" .

      - name: Verify image user is not root
        run: |
          test "$(docker run --rm "${IMAGE_NAME}:ci" id -u)" != "0"

      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:ci
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Gitleaks secret scan
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.28.0 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose

  publish-image:
    name: Optional image publish
    needs: ci
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && vars.PUSH_IMAGE == 'true'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compute image tags
        id: tags
        env:
          REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/fastapi-production-template
        run: |
          TAGS="${REGISTRY_IMAGE}:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS="${TAGS},${REGISTRY_IMAGE}:latest"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAGS="${TAGS},${REGISTRY_IMAGE}:${GITHUB_REF_NAME#v}"
          fi
          printf 'tags=%s\n' "${TAGS}" >> "${GITHUB_OUTPUT}"

      - name: Login to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push image
        env:
          IMAGE_TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          IFS=',' read -ra TAGS <<< "${IMAGE_TAGS}"
          BUILD_ARGS=(
            --build-arg "APP_VERSION=0.1.0"
            --build-arg "BUILD_SHA=${GITHUB_SHA}"
            --build-arg "IMAGE_SOURCE=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
          )
          TAG_ARGS=()
          for tag in "${TAGS[@]}"; do
            TAG_ARGS+=("-t" "$tag")
          done
          docker build "${BUILD_ARGS[@]}" "${TAG_ARGS[@]}" .
          for tag in "${TAGS[@]}"; do
            docker push "$tag"
          done
